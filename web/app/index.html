<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riftbound Card Explorer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="filterBackdrop" class="filter-backdrop" hidden></div>
    <main class="shell">
      <aside class="sidebar" aria-label="Card selection and relation filters">
        <div class="sidebar-top">
          <div class="brand">
            <span class="brand-mark">R</span>
            <div>
              <h1>Riftbound</h1>
              <p>Relation Explorer</p>
            </div>
          </div>
          <button id="closeFilters" class="icon-button mobile-only" type="button" aria-label="Close filters">&times;</button>
        </div>

        <section class="focus-picker">
          <label class="field">
            <span>Focus Card</span>
            <span class="focus-search">
              <input id="cardSearchInput" type="search" placeholder="Search a card to inspect" autocomplete="off" />
              <button id="focusSearchButton" type="button">Search</button>
            </span>
          </label>
        </section>

        <section class="filter-group">
          <h2>Domain</h2>
          <div id="domainFilters" class="chips"></div>
        </section>

        <section class="filter-group">
          <h2>Type</h2>
          <div id="typeFilters" class="chips"></div>
        </section>

        <section class="filter-group">
          <h2>Trigger</h2>
          <div id="triggerFilters" class="chips compact"></div>
        </section>

        <section class="filter-group">
          <h2>Keyword</h2>
          <div id="keywordFilters" class="chips compact"></div>
        </section>

        <section class="filter-group">
          <h2>Energy</h2>
          <div id="energyFilters" class="chips"></div>
        </section>

        <section class="filter-group">
          <h2>Might</h2>
          <div id="mightFilters" class="chips"></div>
        </section>

        <section class="filter-group">
          <h2>Modifier</h2>
          <div id="predicateFilters" class="chips compact"></div>
        </section>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div>
            <strong id="resultCount">Loading</strong>
            <span id="datasetMeta"></span>
          </div>
          <div class="toolbar-actions">
            <button id="openFilters" class="mobile-only" type="button">Filters</button>
            <button id="clearFilters" type="button">Clear</button>
          </div>
        </header>

        <section id="focusPanel" class="focus-panel" aria-live="polite"></section>

        <section id="relationsPanel" class="relations-panel" aria-live="polite"></section>
      </section>
    </main>

    <div id="cardModal" class="modal-backdrop" hidden>
      <article class="card-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button id="closeCardModal" class="icon-button modal-close" type="button" aria-label="Close card details">&times;</button>
        <div id="modalContent"></div>
      </article>
    </div>

    <section id="feedbackWidget" class="feedback-widget" aria-label="Site feedback">
      <form id="feedbackPanel" class="feedback-panel" hidden>
        <div class="feedback-header">
          <div>
            <strong id="feedbackTitle">Improve card relations</strong>
            <p id="feedbackPrompt">Tell us about a missing, incorrect, too broad, or weak relation.</p>
          </div>
          <button id="closeFeedback" class="icon-button feedback-close" type="button" aria-label="Close feedback">&times;</button>
        </div>
        <label class="feedback-field">
          <span>Relation feedback</span>
          <textarea
            id="feedbackText"
            name="feedback"
            maxlength="1200"
            rows="4"
            placeholder="Example: This card should be connected to another card because..."
            required
          ></textarea>
        </label>
        <div class="feedback-actions">
          <span id="feedbackStatus" class="feedback-status" aria-live="polite"></span>
          <button id="feedbackSubmit" class="primary-action" type="submit">Send</button>
        </div>
      </form>
    </section>

    <script src="./app.js"></script>
  </body>
</html>
