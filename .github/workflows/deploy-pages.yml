name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate static assets
        run: |
          node --check web/app/app.js
          test -f data/processed/web/card_explorer_index.json

          relation_shards="$(find data/processed/web/relations -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')"
          fact_shards="$(find data/processed/web/facts -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')"
          test "$relation_shards" -eq 32
          test "$fact_shards" -eq 32

          oversized="$(find data/processed/web -type f -size +50M -print -quit)"
          test -z "$oversized"

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/web _site/data/processed
          cp -R web/app _site/web/app
          cp -R data/processed/web _site/data/processed/web
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Riftboundaries</title>
              <meta http-equiv="refresh" content="0; url=web/app/">
              <link rel="canonical" href="web/app/">
            </head>
            <body>
              <script>window.location.replace("web/app/");</script>
              <a href="web/app/">Open Riftboundaries</a>
            </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
